<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mens Health — Treatments Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    /* Brand — Mens Health orange + gold accent */
    --orange-600:#e8720b;
    --orange-500:#f5820c;
    --orange-400:#ff9425;
    --amber:#ffb020;
    --gold:#ffd23f;
    --gold-deep:#f5b800;

    --ink:#1b1206;
    --ink-soft:#5a4630;
    --ink-onwarm:#3a2a12;
    --white:#ffffff;

    --card-stroke:rgba(27,18,6,.08);
    --radius:18px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}

  .hx-section{
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--white);
    position:relative;
    overflow:hidden;
    padding:clamp(44px,6vw,88px) 20px clamp(52px,7vw,96px);
    background:
      radial-gradient(1100px 620px at 82% -6%, #ffb64d 0%, rgba(255,182,77,0) 58%),
      radial-gradient(820px 520px at 6% 12%, rgba(255,210,63,.42) 0%, rgba(255,210,63,0) 55%),
      linear-gradient(155deg, var(--orange-400) 0%, var(--orange-500) 46%, var(--orange-600) 100%);
  }
  /* faint diagonal texture */
  .hx-section::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(1200px 700px at 50% 0%, #000 0%, transparent 80%);
    mask-image:radial-gradient(1200px 700px at 50% 0%, #000 0%, transparent 80%);
  }
  .hx-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4;pointer-events:none;z-index:0;}
  .hx-blob.b1{width:520px;height:520px;left:-160px;bottom:-120px;background:radial-gradient(circle,#ffe08a,transparent 70%);}
  .hx-blob.b2{width:460px;height:460px;right:-140px;top:-80px;background:radial-gradient(circle,#ff7a1a,transparent 70%);}

  .hx-wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;}

  /* ---- Header ---- */
  .hx-head{text-align:center;margin-bottom:clamp(30px,4vw,46px);}
  .hx-eyebrow{
    display:inline-flex;align-items:center;gap:9px;
    padding:7px 16px 7px 13px;border-radius:100px;
    font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-onwarm);background:rgba(255,255,255,.72);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 6px 18px -10px rgba(80,40,0,.5);
  }
  .hx-dot{width:8px;height:8px;border-radius:50%;background:var(--orange-600);position:relative;}
  .hx-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:hxPulse 2s ease-out infinite;}
  @keyframes hxPulse{0%{box-shadow:0 0 0 0 rgba(232,114,11,.55)}100%{box-shadow:0 0 0 11px rgba(232,114,11,0)}}

  .hx-title{
    margin:20px 0 0;font-weight:900;line-height:1.0;letter-spacing:-.025em;
    font-size:clamp(40px,6.6vw,78px);color:#fff;
    text-shadow:0 3px 26px rgba(120,55,0,.28);
  }
  .hx-title .sub{
    display:block;font-weight:800;letter-spacing:-.02em;
    font-size:clamp(20px,3.2vw,38px);margin-top:.18em;color:#fff;
  }
  .hx-lede{margin:18px auto 0;max-width:660px;color:rgba(255,255,255,.94);
    font-size:clamp(15px,1.8vw,18px);line-height:1.6;font-weight:500;}

  /* ---- Treatments grid ---- */
  .hx-grid{
    display:grid;gap:14px;margin-top:clamp(26px,3.4vw,40px);
    grid-template-columns:repeat(4,1fr);align-items:stretch;
  }

  .hx-card{
    position:relative;display:flex;align-items:center;gap:14px;
    text-decoration:none;color:var(--ink);
    border-radius:var(--radius);padding:16px 16px;
    background:linear-gradient(180deg,#ffffff,#fff7ee);
    border:1px solid var(--card-stroke);
    box-shadow:0 14px 30px -18px rgba(60,25,0,.55);
    transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
    will-change:transform;
  }
  .hx-card:hover,.hx-card:focus-visible{
    transform:translateY(-5px);
    border-color:rgba(232,114,11,.4);
    box-shadow:0 26px 44px -22px rgba(60,25,0,.6), 0 0 0 1px rgba(232,114,11,.18);
    outline:none;
  }
  .hx-card:focus-visible{box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--orange-500);}

  .hx-ico{
    flex:none;display:grid;place-items:center;
    width:46px;height:46px;border-radius:13px;
    background:linear-gradient(180deg,#fff2df,#ffe4c2);
    border:1px solid rgba(232,114,11,.16);
    transition:background .3s var(--ease), transform .3s var(--ease);
  }
  .hx-ico svg{width:24px;height:24px;stroke:var(--orange-600);stroke-width:1.8;fill:none;
    stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s var(--ease);}
  .hx-card:hover .hx-ico{background:linear-gradient(180deg,var(--orange-500),var(--orange-600));transform:scale(1.05);}
  .hx-card:hover .hx-ico svg{stroke:#fff;}

  .hx-body{min-width:0;flex:1;}
  .hx-name{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.2;color:#1b1206;}
  .hx-meta{font-size:12px;font-weight:600;color:#a56a1f;margin-top:3px;
    display:inline-flex;align-items:center;gap:5px;}
  .hx-arrow{flex:none;margin-left:2px;color:#c98a3a;transition:transform .25s var(--ease), color .25s var(--ease);}
  .hx-arrow svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .hx-card:hover .hx-arrow{transform:translateX(4px);color:var(--orange-600);}

  /* Featured (primary nav treatments) */
  .hx-card.feat{
    background:linear-gradient(180deg,#fffdf9,#fff0dc);
    border:1px solid rgba(232,114,11,.28);
  }
  .hx-card.feat .hx-badge{
    position:absolute;top:10px;right:12px;
    font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
    color:var(--orange-600);
  }

  /* View-all footer */
  .hx-foot{display:flex;justify-content:center;margin-top:clamp(26px,3vw,38px);}
  .hx-cta{
    position:relative;overflow:hidden;
    display:inline-flex;align-items:center;gap:10px;text-decoration:none;
    padding:15px 30px;border-radius:100px;
    font-size:16px;font-weight:800;color:var(--ink);
    background:linear-gradient(180deg,var(--gold),var(--gold-deep));
    box-shadow:0 16px 30px -12px rgba(120,70,0,.6), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .2s var(--ease), box-shadow .25s var(--ease), filter .2s var(--ease);
  }
  .hx-cta svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease);}
  .hx-cta:hover{transform:translateY(-2px);filter:brightness(1.04);}
  .hx-cta:hover svg{transform:translateX(4px);}
  .hx-cta:focus-visible{outline:3px solid #fff;outline-offset:3px;}

  /* ---- Men / Women split ---- */
  .hx-gender{
    display:grid;grid-template-columns:1fr 1fr;gap:16px;
    margin-top:clamp(22px,3vw,34px);
  }
  .hx-gcard{
    position:relative;overflow:hidden;
    display:flex;align-items:center;gap:18px;text-decoration:none;
    padding:26px 28px;border-radius:22px;
    color:#fff;
    box-shadow:0 22px 44px -22px rgba(40,15,0,.7), inset 0 1px 0 rgba(255,255,255,.22);
    transition:transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  .hx-gcard.men{background:linear-gradient(135deg,#2a2016 0%,#3a2a12 55%,#5a3a10 100%);}
  .hx-gcard.women{background:linear-gradient(135deg,#7a1246 0%,#a6265f 55%,#d1477e 100%);}
  .hx-gcard::after{ /* corner glow */
    content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);pointer-events:none;
  }
  .hx-gcard:hover,.hx-gcard:focus-visible{
    transform:translateY(-5px);
    box-shadow:0 32px 56px -22px rgba(40,15,0,.75), inset 0 1px 0 rgba(255,255,255,.3);
    outline:none;
  }
  .hx-gcard:focus-visible{box-shadow:0 0 0 3px #fff, 0 0 0 6px rgba(255,255,255,.4);}
  .hx-gico{
    flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:16px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  }
  .hx-gico svg{width:30px;height:30px;stroke:#fff;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .hx-gbody{flex:1;min-width:0;}
  .hx-glabel{display:block;font-size:clamp(24px,3vw,32px);font-weight:900;letter-spacing:-.02em;line-height:1;}
  .hx-gsub{display:block;margin-top:6px;font-size:14px;font-weight:600;color:rgba(255,255,255,.85);}
  .hx-garrow{flex:none;width:24px;height:24px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;
    transition:transform .25s var(--ease);}
  .hx-gcard:hover .hx-garrow{transform:translateX(5px);}

  /* Reveal */
  .hx-reveal{opacity:0;transform:translateY(18px);}
  .hx-reveal.in{opacity:1;transform:none;transition:opacity .5s var(--ease), transform .5s var(--ease);}

  @media (max-width:1024px){ .hx-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:680px){ .hx-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .hx-gender{grid-template-columns:1fr;} }
  @media (max-width:420px){ .hx-grid{grid-template-columns:1fr;} }

  @media (prefers-reduced-motion:reduce){
    .hx-dot::after{animation:none!important;}
    .hx-reveal{opacity:1!important;transform:none!important;transition:none!important;}
    *{scroll-behavior:auto;}
  }
</style>
</head>
<body style="margin:0;background:#e8720b;">

<section class="hx-section" aria-labelledby="hx-title">
  <span class="hx-blob b1" aria-hidden="true"></span>
  <span class="hx-blob b2" aria-hidden="true"></span>

  <div class="hx-wrap">
    <header class="hx-head">
      <span class="hx-eyebrow hx-reveal"><span class="hx-dot" aria-hidden="true"></span>Discover Better Health</span>
      <h1 id="hx-title" class="hx-title hx-reveal">Mens Health<span class="sub">Prescription Medications for Men</span></h1>
      <p class="hx-lede hx-reveal">Doctor-prescribed treatments across every category — pick a condition to get started.</p>
    </header>

    <nav class="hx-grid" id="hx-grid" aria-label="Treatment categories"></nav>

    <div class="hx-gender" aria-label="Shop by who it's for">
      <a class="hx-gcard men hx-reveal" href="https://healthymale.com/">
        <span class="hx-gico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="10" cy="14" r="6"/><path d="M15 9l5-5M15 4h5v5"/></svg>
        </span>
        <span class="hx-gbody">
          <span class="hx-glabel">Men</span>
          <span class="hx-gsub">Shop Men's Health</span>
        </span>
        <svg class="hx-garrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a class="hx-gcard women hx-reveal" href="https://healthymale.com/womens-health/">
        <span class="hx-gico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M12 14v7M8.5 18h7"/></svg>
        </span>
        <span class="hx-gbody">
          <span class="hx-glabel">Women</span>
          <span class="hx-gsub">Shop Women's Health</span>
        </span>
        <svg class="hx-garrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>

    <div class="hx-foot hx-reveal">
      <a class="hx-cta" href="https://healthymale.com/">
        Shop All Treatments
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </div>
</section>

<script>
(function(){
  var base='https://healthymale.com';
  var ARROW='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

  // Icon library — simple line glyphs keyed by name
  var I={
    ed:'<path d="M12 21C7 17 4 13.5 4 9.5A4.5 4.5 0 0112 6a4.5 4.5 0 018 3.5C20 13.5 17 17 12 21z"/>',
    pe:'<path d="M12 3v6M12 21v-3"/><circle cx="12" cy="14" r="4"/><path d="M9.5 12.5l5 3"/>',
    enhance:'<path d="M6 20V10M12 20V4M18 20v-7"/><path d="M4 20h16"/>',
    kit:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/><path d="M12 11v5M9.5 13.5h5"/>',
    testo:'<circle cx="10" cy="14" r="5"/><path d="M14 10l6-6M15 4h5v5"/>',
    hair:'<path d="M5 13a7 7 0 0114 0"/><path d="M7 13c0-4 2-8 5-9M12 13c0-4 1-7 3-8M17 13c0-3 .5-5 1.5-6"/><path d="M4 17h16"/>',
    sexhealth:'<path d="M12 21C7 17 4 13.5 4 9.5A4.5 4.5 0 0112 6a4.5 4.5 0 018 3.5C20 13.5 17 17 12 21z"/><path d="M9 12h6M12 9v6"/>',
    sleep:'<path d="M20 14a8 8 0 11-9.9-9.9 6.5 6.5 0 009.9 9.9z"/><path d="M15 4h4l-4 4h4"/>',
    prostate:'<path d="M12 3s7 3 7 9a7 7 0 01-14 0c0-6 7-9 7-9z"/><path d="M9.5 13.5l2 2 3.5-4"/>',
    weight:'<path d="M6 9h12l1.5 11H4.5L6 9z"/><path d="M9 9a3 3 0 016 0"/>',
    allergy:'<path d="M12 21c-4-3-8-6-8-11a5 5 0 0110 0 5 5 0 0110 0c0 5-4 8-8 11z" transform="scale(.9) translate(1.2 1)"/><path d="M12 8v4"/>',
    brain:'<path d="M9 4a3 3 0 00-3 3 3 3 0 00-1 5 3 3 0 001 5 3 3 0 003 3V4z"/><path d="M15 4a3 3 0 013 3 3 3 0 011 5 3 3 0 01-1 5 3 3 0 01-3 3V4z"/>',
    emergency:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M12 9v6M9 12h6"/>',
    nausea:'<circle cx="12" cy="10" r="7"/><path d="M9 9h.01M15 9h.01M8.5 15c1.5-1.5 5.5-1.5 7 0"/>',
    skin:'<path d="M12 3c3 4 5 6.5 5 9.5A5 5 0 017 12.5C7 9.5 9 7 12 3z"/><path d="M10 14c0 1.5 1 2.5 2 2.5"/>',
    wellness:'<path d="M12 21C7 17 4 13.5 4 9.5A4.5 4.5 0 0112 6a4.5 4.5 0 018 3.5C20 13.5 17 17 12 21z"/>',
    uti:'<path d="M8 4h8l-1 6a5 5 0 01-1 3l-1 7h-2l-1-7a5 5 0 01-1-3z"/><path d="M8 8h8"/>',
    merch:'<path d="M6 8l-2 3v9h16v-9l-2-3"/><path d="M9 8a3 3 0 016 0"/><path d="M6 8h12"/>',
    pain:'<path d="M4 12h4l2-5 3 10 2-5h5"/>',
    test:'<path d="M9 3h6M10 3v7l-5 8a2 2 0 002 3h10a2 2 0 002-3l-5-8V3"/><path d="M8 15h8"/>',
    women:'<circle cx="12" cy="8" r="5"/><path d="M12 13v8M9 18h6"/>'
  };

  // 4 primary nav treatments, then the "More" menu items
  var featured=[
    {n:'Erectile Dysfunction', u:'/erectile-dysfunction/', i:I.ed},
    {n:'Premature Ejaculation', u:'/premature-ejaculation/', i:I.pe},
    {n:'Male Enhancement', u:'/male-enhancement/', i:I.enhance},
    {n:'Emergency Kit', u:'/bundles/emergency-medical-kit/', i:I.kit}
  ];
  var more=[
    {n:'Testosterone Support', u:'/testosterone-support/', i:I.testo},
    {n:'Hair Loss', u:'/hair-loss/', i:I.hair},
    {n:'Sexual Health', u:'/sexual-health/', i:I.sexhealth},
    {n:'Energy & Sleep', u:'/energy-sleep/', i:I.sleep},
    {n:'Prostate Health', u:'/prostate-health/', i:I.prostate},
    {n:'Weight Loss', u:'/weight-loss/', i:I.weight},
    {n:'Allergy Relief', u:'/allergy-relief/', i:I.allergy},
    {n:'Brain Health', u:'/brain-health/', i:I.brain},
    {n:'Emergency Medical', u:'/emergency-medical-treatments/', i:I.emergency},
    {n:'Nausea & Vomiting', u:'/nausea-vomiting/', i:I.nausea},
    {n:'Skin Care', u:'/skincare/', i:I.skin},
    {n:'Sexual Wellness', u:'/sexual-wellness/', i:I.wellness},
    {n:'Urinary Tract Infection', u:'/urinary-tract-infection/', i:I.uti},
    {n:'Branded Merchandise', u:'/merchandise/', i:I.merch},
    {n:'Pain Relief', u:'/pain-relief/', i:I.pain},
    {n:'Test Kits', u:'/test-kits/', i:I.test},
    {n:'Womens Health', u:'/womens-health/', i:I.women}
  ];

  function card(t,isFeat){
    return '\
<a class="hx-card hx-reveal'+(isFeat?' feat':'')+'" href="'+base+t.u+'">\
  '+(isFeat?'<span class="hx-badge">Popular</span>':'')+'\
  <span class="hx-ico" aria-hidden="true"><svg viewBox="0 0 24 24">'+t.i+'</svg></span>\
  <span class="hx-body">\
    <span class="hx-name">'+t.n+'</span>\
    <span class="hx-meta">Shop treatment</span>\
  </span>\
  <span class="hx-arrow" aria-hidden="true">'+ARROW+'</span>\
</a>';
  }

  var grid=document.getElementById('hx-grid');
  grid.innerHTML =
    featured.map(function(t){return card(t,true);}).join('') +
    more.map(function(t){return card(t,false);}).join('');

  // Staggered reveal
  var items=[].slice.call(document.querySelectorAll('.hx-reveal'));
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          var el=e.target, d=parseInt(el.getAttribute('data-d')||'0',10);
          setTimeout(function(){el.classList.add('in');},d);
          io.unobserve(el);
        }
      });
    },{threshold:.12,rootMargin:'0px 0px -6% 0px'});
    items.forEach(function(el,i){ el.setAttribute('data-d',Math.min(i,14)*45); io.observe(el); });
  } else {
    items.forEach(function(el){el.classList.add('in');});
  }
})();
</script>
</body>
</html>
