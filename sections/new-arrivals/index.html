<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>eDrugstore — New Arrivals</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    /* Brand — deep navy + red accent (eDrugstore) */
    --navy-900:#050c22;
    --navy-800:#08132f;
    --navy-700:#0b1d47;
    --ink:#e8eefc;
    --ink-dim:#a9b7d6;
    --ink-faint:#7f8fb5;

    --blue:#2f6bff;
    --blue-bright:#4f8bff;
    --cyan:#38bdf8;
    --red:#ef4444;
    --red-deep:#dc2626;
    --gold:#f6b73c;

    --card-stroke:rgba(255,255,255,.10);
    --card-stroke-hi:rgba(255,255,255,.22);
    --radius:22px;
    --shadow-card:0 24px 50px -24px rgba(0,0,0,.75);
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}

  .na-section{
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink);
    position:relative;
    overflow:hidden;
    padding:clamp(56px,7vw,104px) 20px clamp(64px,8vw,120px);
    background:
      radial-gradient(1200px 640px at 50% -8%, #123a86 0%, rgba(18,58,134,0) 60%),
      radial-gradient(900px 520px at 90% 8%, rgba(56,189,248,.16) 0%, rgba(56,189,248,0) 55%),
      radial-gradient(760px 520px at 6% 22%, rgba(239,68,68,.10) 0%, rgba(239,68,68,0) 55%),
      linear-gradient(180deg, var(--navy-800) 0%, var(--navy-900) 100%);
  }
  /* faint engineered grid + drifting aurora blobs */
  .na-section::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(1000px 600px at 50% 0%, #000 0%, transparent 78%);
    mask-image:radial-gradient(1000px 600px at 50% 0%, #000 0%, transparent 78%);
  }
  .na-blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none;z-index:0;}
  .na-blob.b1{width:520px;height:520px;left:-140px;top:60px;background:radial-gradient(circle,#1b5bd6,transparent 70%);animation:naFloat 16s var(--ease) infinite;}
  .na-blob.b2{width:460px;height:460px;right:-120px;top:120px;background:radial-gradient(circle,#0e8fb8,transparent 70%);animation:naFloat 20s var(--ease) infinite reverse;}
  @keyframes naFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,26px,0)}}

  .na-wrap{position:relative;z-index:2;max-width:1200px;margin:0 auto;}

  /* ---- Header ---- */
  .na-head{text-align:center;margin-bottom:clamp(34px,4vw,52px);}
  .na-eyebrow{
    display:inline-flex;align-items:center;gap:9px;
    padding:7px 16px 7px 12px;border-radius:100px;
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:#bfe0ff;background:rgba(47,107,255,.12);
    border:1px solid rgba(79,139,255,.35);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(6px);
  }
  .na-dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);position:relative;box-shadow:0 0 0 0 rgba(56,189,248,.6);}
  .na-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:naPulse 2s ease-out infinite;}
  @keyframes naPulse{0%{box-shadow:0 0 0 0 rgba(56,189,248,.55)}100%{box-shadow:0 0 0 12px rgba(56,189,248,0)}}

  .na-title{
    margin:22px 0 0;font-weight:800;line-height:1.03;letter-spacing:-.02em;
    font-size:clamp(38px,6.2vw,74px);
    background:linear-gradient(180deg,#ffffff 0%,#cfe0ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 30px rgba(120,170,255,.18);
  }
  .na-title .brand{
    font-family:'Fraunces',serif;font-style:italic;font-weight:600;
    background:linear-gradient(180deg,#8fc2ff 0%,#4f8bff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    padding-right:.06em;
  }
  .na-sub{margin:16px auto 0;max-width:600px;color:var(--ink-dim);font-size:clamp(15px,1.7vw,18px);line-height:1.6;}

  .na-trust{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px;}
  .na-chip{
    display:inline-flex;align-items:center;gap:9px;
    padding:9px 16px;border-radius:100px;font-size:13.5px;font-weight:500;color:var(--ink);
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
    border:1px solid var(--card-stroke);backdrop-filter:blur(10px);
  }
  .na-chip svg{width:16px;height:16px;flex:none;}
  .na-chip .k{color:var(--ink-faint);font-weight:400;}
  .na-chip.hero{padding:11px 20px;font-size:14.5px;}
  .na-chip.hero b{font-weight:700;}
  .na-check{color:#4ade80;}

  /* ---- Grid ---- */
  .na-grid{
    display:grid;gap:22px;margin-top:clamp(34px,4vw,52px);
    grid-template-columns:repeat(4,1fr);align-items:stretch;
  }

  .na-card{
    position:relative;display:flex;flex-direction:column;
    border-radius:var(--radius);padding:22px 22px 24px;
    background:linear-gradient(180deg,#ffffff,#f6f8fc);
    border:1px solid rgba(15,23,42,.06);
    box-shadow:var(--shadow-card);
    transition:transform .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease);
    will-change:transform;
  }
  /* soft top highlight */
  .na-card::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0) 30%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  }
  .na-card:hover{
    transform:translateY(-8px);
    border-color:rgba(47,107,255,.28);
    box-shadow:0 40px 66px -26px rgba(4,10,32,.75), 0 0 0 1px rgba(47,107,255,.18);
  }

  /* Featured — white card lifted with a blue accent + halo */
  .na-card.featured{
    background:linear-gradient(180deg,#ffffff,#f2f6ff);
    border:1px solid rgba(47,107,255,.45);
    box-shadow:0 40px 72px -26px rgba(10,20,60,.8), 0 0 52px -18px rgba(79,139,255,.75);
  }
  .na-card.featured::after{
    content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
    background:radial-gradient(120% 60% at 50% 0%, rgba(96,150,255,.35), transparent 60%);
    opacity:.9;z-index:-1;filter:blur(2px);
  }
  .na-ribbon{
    position:absolute;top:-13px;left:50%;transform:translateX(-50%);
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    padding:7px 15px;border-radius:100px;font-size:11px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;color:#3a2a05;
    background:linear-gradient(180deg,#ffd27a,#f6b73c);
    box-shadow:0 8px 20px -6px rgba(246,183,60,.7);
  }
  .na-ribbon svg{width:13px;height:13px;}

  /* Product visual */
  .na-visual{
    position:relative;display:flex;align-items:center;justify-content:center;
    height:190px;margin:6px 0 18px;border-radius:16px;
    background:linear-gradient(180deg,#f2f6fc,#e7eef8);
    border:1px solid rgba(15,23,42,.05);
    overflow:hidden;
  }
  .na-visual::after{ /* pedestal shadow */
    content:"";position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    width:118px;height:20px;border-radius:50%;
    background:radial-gradient(closest-side, rgba(15,23,42,.22), transparent);
    filter:blur(3px);
  }
  .na-bottle{position:relative;z-index:1;height:158px;width:auto;filter:drop-shadow(0 16px 20px rgba(15,23,42,.28));
    transition:transform .45s var(--ease);}
  .na-card:hover .na-bottle{transform:translateY(-4px) rotate(-1.5deg);}

  .na-cat{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:7px;}
  .na-cat i{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .na-name{font-size:21px;font-weight:800;letter-spacing:-.015em;margin:9px 0 3px;color:#0f172a;}
  .na-desc{font-size:13.5px;color:#5a6b86;line-height:1.45;min-height:38px;}

  .na-rate{display:flex;align-items:center;gap:8px;margin:14px 0 2px;}
  .na-stars{display:inline-flex;gap:2px;}
  .na-stars svg{width:15px;height:15px;}
  .na-star-on{color:var(--gold);}
  .na-star-off{color:#d3dbe8;}
  .na-rate .score{font-weight:800;font-size:13.5px;color:#0f172a;}
  .na-rate .count{font-size:12.5px;color:#8593ab;font-variant-numeric:tabular-nums;}

  .na-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .na-was{color:#9aa6bd;text-decoration:line-through;font-size:15px;font-variant-numeric:tabular-nums;}
  .na-now{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#0f172a;}
  .na-save{margin-left:auto;font-size:11.5px;font-weight:800;color:#15803d;
    background:rgba(22,163,74,.10);border:1px solid rgba(22,163,74,.25);
    padding:5px 10px;border-radius:8px;white-space:nowrap;}

  .na-cta{
    margin-top:18px;position:relative;overflow:hidden;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;
    padding:14px 18px;border:0;border-radius:13px;
    font-family:inherit;font-size:15px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,var(--red),var(--red-deep));
    box-shadow:0 12px 24px -10px rgba(220,38,38,.7);
    transition:transform .2s var(--ease), box-shadow .25s var(--ease), filter .2s var(--ease);
  }
  .na-cta.blue{background:linear-gradient(180deg,var(--blue-bright),var(--blue));
    box-shadow:0 12px 26px -10px rgba(47,107,255,.75);}
  .na-cta svg{width:17px;height:17px;transition:transform .25s var(--ease);}
  .na-cta:hover{transform:translateY(-2px);filter:brightness(1.06);}
  .na-cta:hover svg{transform:translateX(4px);}
  .na-cta:active{transform:translateY(0);}
  .na-cta::after{ /* sheen sweep */
    content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
    transform:skewX(-18deg);transition:left .6s var(--ease);
  }
  .na-cta:hover::after{left:130%;}

  /* focus visibility */
  .na-cta:focus-visible{outline:3px solid #bcd3ff;outline-offset:3px;}

  /* Reveal animation */
  .na-reveal{opacity:0;transform:translateY(22px) scale(.97);}
  .na-reveal.in{opacity:1;transform:none;transition:opacity .6s var(--ease), transform .6s var(--ease);}

  /* ---- Responsive ---- */
  @media (max-width:1024px){ .na-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){
    .na-grid{grid-template-columns:1fr;gap:18px;}
    .na-card.featured{transform:none;}
    .na-visual{height:200px;}
  }

  @media (prefers-reduced-motion:reduce){
    .na-blob,.na-dot::after,.na-bottle,.na-cta::after{animation:none!important;transition:none!important;}
    .na-reveal{opacity:1!important;transform:none!important;}
    *{scroll-behavior:auto;}
  }
</style>
</head>
<body style="margin:0;background:#050c22;">

<section class="na-section" aria-labelledby="na-title">
  <span class="na-blob b1" aria-hidden="true"></span>
  <span class="na-blob b2" aria-hidden="true"></span>

  <div class="na-wrap">
    <header class="na-head">
      <span class="na-eyebrow na-reveal"><span class="na-dot" aria-hidden="true"></span>Just Launched</span>
      <h2 id="na-title" class="na-title na-reveal">New Arrivals at <span class="brand">eDrugstore</span></h2>
      <p class="na-sub na-reveal">Four new doctor-prescribed treatments, now at introductory pricing.</p>

      <div class="na-trust">
        <span class="na-chip hero na-reveal">
          <svg viewBox="0 0 24 24" fill="none" class="na-check" aria-hidden="true"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <b>No subscriptions.</b>&nbsp;<span class="k">Buy only what you need — never auto-billed.</span>
        </span>
      </div>

      <div class="na-trust">
        <span class="na-chip na-reveal">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 7h11v8H3zM14 10h4l3 3v2h-7z" stroke="#8fc2ff" stroke-width="1.7" stroke-linejoin="round"/><circle cx="7" cy="17" r="2" stroke="#8fc2ff" stroke-width="1.7"/><circle cx="17" cy="17" r="2" stroke="#8fc2ff" stroke-width="1.7"/></svg>
          Free discreet shipping
        </span>
        <span class="na-chip na-reveal">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l7 3v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z" stroke="#8fc2ff" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#8fc2ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          US-licensed pharmacy
        </span>
        <span class="na-chip na-reveal">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 11V8a5 5 0 0110 0v3" stroke="#8fc2ff" stroke-width="1.7" stroke-linecap="round"/><rect x="5" y="11" width="14" height="9" rx="2" stroke="#8fc2ff" stroke-width="1.7"/></svg>
          100% confidential
        </span>
      </div>
    </header>

    <div class="na-grid" id="na-grid"></div>
  </div>
</section>

<script>
(function(){
  var STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.9 6.2 21l1.1-6.5L2.6 9.9l6.5-.9z"/></svg>';
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // Self-contained SVG "bottle" so the section needs no external product images.
  function bottle(o){
    return '\
<svg class="na-bottle" viewBox="0 0 130 200" role="img" aria-label="'+o.name+' product">\
  <defs>\
    <linearGradient id="'+o.id+'b" x1="0" y1="0" x2="1" y2="1">\
      <stop offset="0" stop-color="'+o.body[0]+'"/><stop offset="1" stop-color="'+o.body[1]+'"/>\
    </linearGradient>\
    <linearGradient id="'+o.id+'g" x1="0" y1="0" x2="0" y2="1">\
      <stop offset="0" stop-color="rgba(255,255,255,.55)"/><stop offset=".5" stop-color="rgba(255,255,255,0)"/>\
    </linearGradient>\
  </defs>\
  <rect x="42" y="6" width="46" height="20" rx="5" fill="'+o.cap+'"/>\
  <rect x="42" y="22" width="46" height="7" rx="2" fill="rgba(0,0,0,.25)"/>\
  <rect x="30" y="28" width="70" height="164" rx="16" fill="url(#'+o.id+'b)"'+(o.stroke?' stroke="'+o.stroke+'" stroke-width="1.2"':'')+'/>\
  <rect x="36" y="34" width="12" height="150" rx="6" fill="url(#'+o.id+'g)" opacity=".7"/>\
  <rect x="34" y="70" width="62" height="86" rx="8" fill="'+o.label+'"/>\
  <text x="65" y="96" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" fill="'+o.labelText+'">'+o.short+'</text>\
  <text x="65" y="113" text-anchor="middle" font-family="Inter,sans-serif" font-size="7.5" letter-spacing="1.5" font-weight="700" fill="'+o.labelSub+'">'+o.tag+'</text>\
  <rect x="42" y="124" width="46" height="4" rx="2" fill="'+o.labelSub+'" opacity=".5"/>\
  <rect x="46" y="133" width="38" height="3" rx="1.5" fill="'+o.labelSub+'" opacity=".35"/>\
  '+o.pills+'\
</svg>';
  }
  function pill(cx,cy,c){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="11" ry="7" fill="'+c+'" stroke="rgba(0,0,0,.15)"/>';}

  var products=[
    {cat:'Weight Loss',catColor:'#2563eb',name:'GLP SP 2mg',desc:'GLP-1 + Pyridoxine B6',
     score:'4.8',count:'1,284',was:'148.50',now:'126.23',save:'15%',cta:'red',
     b:{id:'p1',name:'GLP SP',short:'GLP-1',tag:'WEIGHT LOSS',cap:'#1b2436',body:['#232f45','#131a2b'],label:'#f5f7fb',labelText:'#101828',labelSub:'#5b6478',
        pills:pill(48,178,'#7fb2ff')+pill(74,182,'#7fb2ff')}},
    {cat:'Weight Loss',catColor:'#2563eb',name:'GLP T 3mg',desc:'GLP-1 T Daily ODT Pill',
     score:'4.8',count:'1,284',was:'268.50',now:'228.23',save:'15%',cta:'red',
     b:{id:'p2',name:'GLP T',short:'GLP-1',tag:'DAILY ODT',cap:'#1b2436',body:['#232f45','#131a2b'],label:'#f5f7fb',labelText:'#101828',labelSub:'#4b8f5e',
        pills:pill(50,180,'#7fe0a5')+pill(76,180,'#7fe0a5')}},
    {cat:'Erectile Dysfunction',catColor:'#4f46e5',name:'ED4 Chew',desc:'Tadalafil 5mg + Vardenafil 5mg',
     score:'4.9',count:'3,612',was:'99.00',now:'74.25',save:'25%',cta:'blue',featured:true,popular:'3,600+ reorders',
     b:{id:'p3',name:'ED4',short:'ED⁴',tag:'CHEW',cap:'#111827',body:['#1c2740','#0c1220'],label:'#0f1626',labelText:'#eaf1ff',labelSub:'#8fb0ff',
        pills:'<rect x="40" y="172" width="22" height="16" rx="4" fill="#a7c4ff"/><rect x="68" y="176" width="22" height="16" rx="4" fill="#a7c4ff"/>'}},
    {cat:'Sexual Health',catColor:'#0891b2',name:'Doxy PEP',desc:'Morning-After STI Prevention',
     score:'4.7',count:'510',was:'49.00',now:'36.75',save:'25%',cta:'red',
     b:{id:'p4',name:'Doxy',short:'DoxyPEP',tag:'100 MG',cap:'#2a7fb8',body:['#eef4fa','#cdddec'],label:'#ffffff',labelText:'#0e5a86',labelSub:'#3b7fa8',stroke:'rgba(15,23,42,.14)',
        pills:pill(50,180,'#bfe0f5')+pill(76,182,'#bfe0f5')}}
  ];

  function stars(score){
    var s=Math.round(parseFloat(score)), html='';
    for(var i=1;i<=5;i++){ html+='<span class="'+(i<=s?'na-star-on':'na-star-off')+'">'+STAR+'</span>'; }
    return html;
  }

  var grid=document.getElementById('na-grid');
  grid.innerHTML=products.map(function(p){
    return '\
<article class="na-card na-reveal'+(p.featured?' featured':'')+'">\
  '+(p.popular?'<span class="na-ribbon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.9 6.2 21l1.1-6.5L2.6 9.9l6.5-.9z"/></svg>Most Popular</span>':'')+'\
  <div class="na-visual">'+bottle(p.b)+'</div>\
  <span class="na-cat" style="color:'+p.catColor+'"><i style="background:'+p.catColor+'"></i>'+p.cat+'</span>\
  <h3 class="na-name">'+p.name+'</h3>\
  <p class="na-desc">'+p.desc+'</p>\
  <div class="na-rate" aria-label="Rated '+p.score+' out of 5 from '+p.count+' reviews">\
    <span class="na-stars" aria-hidden="true">'+stars(p.score)+'</span>\
    <span class="score">'+p.score+'</span><span class="count">· '+p.count+'</span>\
  </div>\
  <div class="na-price">\
    <span class="na-was">$'+p.was+'</span>\
    <span class="na-now">$'+p.now+'</span>\
    <span class="na-save">Save '+p.save+'</span>\
  </div>\
  <button class="na-cta'+(p.cta==='blue'?' blue':'')+'" type="button">Buy Now '+ARROW+'</button>\
</article>';
  }).join('');

  // Staggered reveal on scroll
  var items=[].slice.call(document.querySelectorAll('.na-reveal'));
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          var el=e.target;
          var delay=parseInt(el.getAttribute('data-d')||'0',10);
          setTimeout(function(){el.classList.add('in');},delay);
          io.unobserve(el);
        }
      });
    },{threshold:.15,rootMargin:'0px 0px -8% 0px'});
    items.forEach(function(el,i){ el.setAttribute('data-d',(i*70)); io.observe(el); });
  } else {
    items.forEach(function(el){el.classList.add('in');});
  }
})();
</script>
</body>
</html>
